name: Home depoimentos

on:
  pull_request:
    paths:
      - 'app/(public)/page.tsx'
      - 'components/public/SomaSuccessStories.tsx'
      - 'tests/home-depoimentos.test.mjs'
      - 'app/globals.css'
      - 'components/PortalShell.module.css'
      - '.github/workflows/home-depoimentos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  depoimentos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Testar LP
        run: node --test tests/home-depoimentos.test.mjs
