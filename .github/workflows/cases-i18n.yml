name: SOMA cases and languages regression
on:
  pull_request:
    paths:
      - 'components/LocaleProvider.tsx'
      - 'components/LocalizedText.tsx'
      - 'components/AppShell.tsx'
      - 'components/CollapsibleSidebar.tsx'
      - 'components/IrisCopiloto.tsx'
      - 'app/(public)/cases/**'
      - 'app/(public)/page.tsx'
      - 'tests/i18n-cases.test.mjs'
      - 'tests/onboarding-i18n.test.mjs'
      - 'lib/i18n/onboarding-copy.ts'
      - 'app/(dashboard)/onboarding/OnboardingClient.tsx'
      - '.github/workflows/cases-i18n.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node tests/i18n-cases.test.mjs
      - run: node tests/onboarding-i18n.test.mjs
