name: Refresh security lockfile once
on:
  push:
    branches: ['fix/security-audit-and-vercel-20261023']
    paths:
      - 'package.json'
      - '.github/workflows/security-lock-refresh.yml'

permissions:
  contents: write

jobs:
  secure-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: fix/security-audit-and-vercel-20261023
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve new lockfile without executing dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check lockfile consistency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Push regenerated lockfile to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(lockfile): resolve patched dependencies'
            git push origin HEAD:fix/security-audit-and-vercel-20261023
          fi
