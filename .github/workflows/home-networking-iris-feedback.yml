name: Soma networking e Iris feedback
on:
  pull_request:
    paths:
      - 'app/(public)/page.tsx'
      - 'components/public/SomaNetworking.tsx'
      - 'components/IrisCopiloto.tsx'
      - 'app/api/copiloto/feedback/route.ts'
      - 'tests/home-networking-iris-feedback.test.mjs'
      - '.github/workflows/home-networking-iris-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Testar isolamento e experiencia
        run: node --test tests/home-networking-iris-feedback.test.mjs
