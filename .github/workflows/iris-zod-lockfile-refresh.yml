name: Temporary Iris Zod lockfile refresh
on:
  push:
    branches: ['feat/iris-sidebar-plano-acao-20261023']
    paths:
      - 'package.json'
      - '.github/workflows/iris-zod-lockfile-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scoped branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: feat/iris-sidebar-plano-acao-20261023
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Refresh lockfile from npm registry without dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check dependency resolution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit resulting lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(lockfile): apply patched Zod dependency'
            git push origin HEAD:feat/iris-sidebar-plano-acao-20261023
          fi
