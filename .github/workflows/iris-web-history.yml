name: Iris Copilot web validation
on:
  pull_request:
    paths:
      - 'app/(dashboard)/admin/AdminClient.tsx'
      - 'app/(dashboard)/admin/usuarios/UsuariosClient.tsx'
      - 'tests/admin-operacao.cjs'
      - 'components/IrisCopiloto.tsx'
      - 'app/api/copiloto/**'
      - 'lib/iris-web-history.ts'
      - 'lib/iris-mentoria-voz.ts'
      - 'lib/iris-comunicacao.ts'
      - 'lib/iris-pesquisa-publica.ts'
      - 'lib/config/portalNavigation.ts'
      - 'lib/config/tipsConfig.ts'
      - 'lib/product-analytics.ts'
      - 'lib/ai-json.ts'
      - 'lib/iris-ai-response.ts'
      - 'app/(dashboard)/plano-acoes-iris/**'
      - 'supabase/migrations/20261023153000_iris_action_plans.sql'
      - 'supabase/migrations/20261022154000_iris_web_historico_opt_in.sql'
      - 'supabase/migrations/20261023212000_iris_history_privacy_preference.sql'
      - 'tests/iris-historico-web.test.mjs'
      - 'tests/iris-privacy-session.test.mjs'
      - 'tests/iris-coaching-ux.test.mjs'
      - 'tests/iris-voice-plan.test.mjs'
      - 'tests/iris-json-resilience.test.mjs'
      - 'tests/iris-comunicacao-clara.test.mjs'
      - 'tests/iris-pesquisa-publica.test.mjs'
      - 'tests/iris-sidebar-navigation.test.mjs'
      - '.github/workflows/iris-web-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iris-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Enforce patched Node.js for Brotli security
        run: |
          node -e "const [major,minor,patch] = process.versions.node.split('.').map(Number); if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) { console.error('Node.js Brotli patch required: 24.22.1+'); process.exit(1); }"
      - name: Verify privacy and isolation source tests
        run: node --test tests/iris-historico-web.test.mjs tests/iris-coaching-ux.test.mjs tests/iris-voice-plan.test.mjs tests/iris-privacy-session.test.mjs
      - name: Verify Iris sidebar navigation
        run: node --test tests/iris-sidebar-navigation.test.mjs
      - name: Validate free-text fallback and strict JSON boundaries
        run: node --experimental-strip-types --test tests/iris-json-resilience.test.mjs
      - name: Check accessible Iris language and quick-reply semantics
        run: node --experimental-strip-types --test tests/iris-comunicacao-clara.test.mjs
      - name: Verify Iris public research safety
        run: node --experimental-strip-types --test tests/iris-pesquisa-publica.test.mjs
      - name: Install
        run: npm ci
      - name: Verify widget state and administrative destinations
        run: node tests/iris-widget-navigation.cjs
      - name: Verify administrative filters and role updates
        run: node tests/admin-operacao.cjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          SENDGRID_API_KEY: placeholder
          SENDGRID_FROM_EMAIL: contato@example.com
          NEXT_PUBLIC_POSTHOG_KEY: placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://us.posthog.com
