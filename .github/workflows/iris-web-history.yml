name: Iris Copilot web validation
on:
  pull_request:
    paths:
      - 'components/IrisCopiloto.tsx'
      - 'app/api/copiloto/**'
      - 'lib/iris-web-history.ts'
      - 'supabase/migrations/20261022154000_iris_web_historico_opt_in.sql'
      - 'tests/iris-historico-web.test.mjs'
      - '.github/workflows/iris-web-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iris-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify privacy and isolation source tests
        run: node --test tests/iris-historico-web.test.mjs
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          SENDGRID_API_KEY: placeholder
          SENDGRID_FROM_EMAIL: contato@example.com
          NEXT_PUBLIC_POSTHOG_KEY: placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://us.posthog.com
